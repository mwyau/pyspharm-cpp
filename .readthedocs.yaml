# SPDX-License-Identifier: GPL-2.0-or-later
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

python:
  install:
    - method: uv
      command: sync
      groups:
        - build
        - docs
        - test

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

submodules:
  include:
    - third_party/ducc
  recursive: true
