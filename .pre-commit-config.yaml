# SPDX-License-Identifier: GPL-2.0-or-later
repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        exclude: ^benchmarks/results/.*\.csv$
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]
        files: ^src/cpp/.*\.(cpp|hpp)$

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies: [mdformat-myst==0.3.0]
        files: ^(README\.md|CONTRIBUTING\.md|CHANGELOG\.md|docs/.*\.md)$

  - repo: local
    hooks:
      - id: ty
        name: ty type checking
        entry: uv run --locked --no-sync ty check typing/consumer.py
        language: system
        pass_filenames: false
        always_run: true
