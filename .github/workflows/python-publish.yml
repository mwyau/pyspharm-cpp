name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-policy:
    name: Validate tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Check tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"

  wheels:
    name: Release wheels
    needs: release-policy
    uses: $/.github/workflows/wheels.yml
    with:
      release: true

  sdist:
    name: Release sdist
    needs: release-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked build tools
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --no-install-project
      - name: Build source distribution
        run: >-
          uv run --locked --no-sync --python 3.14 python -m build
          --sdist --no-isolation --outdir dist/sdist .
      - name: Upload source distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-sdist
          path: dist/sdist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [release-policy, wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ contains(github.ref_name, '.dev') && 'testpypi' || 'pypi' }}
      url: ${{ contains(github.ref_name, '.dev') && 'https://test.pypi.org/p/pyspharm-cpp' || 'https://pypi.org/p/pyspharm-cpp' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked release tools
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --no-default-groups --group release --no-install-project
      - name: Download release distributions
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate distribution metadata
        run: uv run --locked --no-sync twine check dist/*
      - name: Attest release files
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*
          subject-name: pyspharm-cpp
      - name: Publish to selected package index
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/
          repository-url: ${{ contains(github.ref_name, '.dev') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  github-release:
    name: GitHub release
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *.dev* ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease --latest=false
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
