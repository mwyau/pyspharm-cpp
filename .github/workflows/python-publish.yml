# SPDX-License-Identifier: GPL-2.0-or-later
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-policy:
    name: Validate tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release tag and prerequisite tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/check_release.py --evidence

  wheels:
    name: Release wheels (${{ matrix.target }})
    needs: release-policy
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            runner_arch: x86_64
            wheel_platform_arch: x86_64
            cibw_arch: x86_64
            profile: multiarch
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            runner_arch: arm64
            wheel_platform_arch: aarch64
            cibw_arch: aarch64
            profile: portable
          - target: macos-x86_64
            runner: macos-15-intel
            runner_arch: x86_64
            wheel_platform_arch: x86_64
            cibw_arch: x86_64
            macos_deployment_target: "11.0"
            profile: portable
          - target: macos-arm64
            runner: macos-15
            runner_arch: arm64
            wheel_platform_arch: arm64
            cibw_arch: arm64
            macos_deployment_target: "11.0"
            profile: portable
          - target: windows-x86_64
            runner: windows-2025
            runner_arch: x86_64
            wheel_platform_arch: amd64
            cibw_arch: AMD64
            profile: portable
    runs-on: ${{ matrix.runner }}
    env:
      CIBW_ARCHS: ${{ matrix.cibw_arch }}
      CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
      CIBW_TEST_REQUIRES: "pytest>=8"
      CIBW_TEST_COMMAND: >-
        python -m pytest --ignore="{project}/tests/parity" "{project}/tests"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install build Python
        run: uv python install 3.14
      - name: Verify runner architecture
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: >-
          uv run --python 3.14 --no-project python -c
          "import os, platform; aliases = {'amd64': 'x86_64', 'x86_64': 'x86_64', 'arm64': 'arm64', 'aarch64': 'arm64'}; actual = aliases.get(platform.machine().lower(), platform.machine().lower()); expected = os.environ['EXPECTED_RUNNER_ARCH']; print(f'runner architecture: {platform.machine()} -> {actual}; expected {expected}'); assert actual == expected"
      - name: Install release build dependencies
        run: uv sync --locked --python 3.14 --no-default-groups --group release --no-install-project
      - name: Build and test CPython 3.11 wheel
        env:
          CIBW_BUILD: cp311-*
          CIBW_CONFIG_SETTINGS: cmake.define.SPHARM_CPP_BUILD_PROFILE=${{ matrix.profile }}
        run: uv run --locked --no-sync cibuildwheel --output-dir wheelhouse/cp311
      - name: Build and test CPython 3.12+ abi3 wheel
        env:
          CIBW_BUILD: cp312-*
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.SPHARM_CPP_BUILD_PROFILE=${{ matrix.profile }}
            cmake.define.SPHARM_CPP_STABLE_ABI=ON
            wheel.py-api=cp312
        run: uv run --locked --no-sync cibuildwheel --output-dir wheelhouse/abi3
      - name: Build and test free-threaded wheels
        env:
          CIBW_BUILD: cp314t-* cp315t-*
          CIBW_CONFIG_SETTINGS: cmake.define.SPHARM_CPP_BUILD_PROFILE=${{ matrix.profile }}
        run: uv run --locked --no-sync cibuildwheel --output-dir wheelhouse/free-threaded
      - name: Verify wheel platform tags
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_WHEEL_ARCH: ${{ matrix.wheel_platform_arch }}
          MACOS_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: uv run --locked --no-sync python .github/verify_wheel_tags.py
      - name: Collect verified wheels
        shell: bash
        run: |
          mkdir -p wheelhouse-artifact
          find wheelhouse -type f -name '*.whl' -exec cp {} wheelhouse-artifact/ \;
          expected=4
          case "${{ matrix.target }}" in
            linux-*) expected=8 ;;
          esac
          test "$(find wheelhouse-artifact -maxdepth 1 -name '*.whl' | wc -l)" -eq "$expected"
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-wheels-${{ matrix.target }}
          path: wheelhouse-artifact/*.whl
          if-no-files-found: error

  sdist:
    name: Release sdist
    needs: release-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked build tools
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --no-install-project
      - name: Build source distribution
        run: >-
          uv run --locked --no-sync --python 3.14 python -m build
          --sdist --no-isolation --outdir dist/sdist .
      - name: Upload source distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-sdist
          path: dist/sdist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [release-policy, wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ contains(github.ref_name, '.dev') && 'testpypi' || 'pypi' }}
      url: ${{ contains(github.ref_name, '.dev') && 'https://test.pypi.org/p/pyspharm-cpp' || 'https://pypi.org/p/pyspharm-cpp' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release tag points to tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/check_release.py
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked release tools
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --no-default-groups --group release --no-install-project
      - name: Download release distributions
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate distribution metadata
        run: uv run --locked --no-sync twine check dist/*
      - name: Attest release files
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*
          subject-name: pyspharm-cpp
      - name: Recheck release tag before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/check_release.py
      - name: Publish to selected package index
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/
          repository-url: ${{ contains(github.ref_name, '.dev') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  github-release:
    name: GitHub release
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *.dev* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --prerelease --latest=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
