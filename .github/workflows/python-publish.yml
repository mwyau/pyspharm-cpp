# SPDX-License-Identifier: GPL-2.0-or-later
name: Build and publish distribution

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Package index to publish to after the build and environment approval
        type: choice
        required: true
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-policy:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify tag, project version, and package-index route
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          repository = os.environ["REPOSITORY"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          match = re.fullmatch(
              r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:\.dev(?:0|[1-9][0-9]*))?",
              tag,
          )
          if match is None:
              raise SystemExit("release tags must have the form vX.Y.Z or vX.Y.Z.devN")
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match project version {version!r}")
          expected = "testpypi" if ".dev" in tag else "pypi"
          if repository != expected:
              raise SystemExit(f"tag {tag!r} must publish to {expected}, not {repository!r}")
          print(f"Validated {'development' if expected == 'testpypi' else 'stable'} release {tag} for {repository}")
          PY
      - name: Require successful CI and PySpharm parity evidence for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_and_check_tag() {
            local object_type object_sha tag_json
            local -A seen=()
            tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}")"
            object_type="$(jq -r '.object.type // empty' <<<"$tag_json")"
            object_sha="$(jq -r '.object.sha // empty' <<<"$tag_json")"
            for _ in {1..16}; do
              [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]] || {
                echo "tag ${TAG_NAME} resolves to an invalid Git object" >&2
                return 1
              }
              [[ "$object_type" == "commit" ]] && break
              [[ "$object_type" == "tag" ]] || {
                echo "tag ${TAG_NAME} resolves to ${object_type}, not a commit" >&2
                return 1
              }
              [[ -z "${seen[$object_sha]:-}" ]] || {
                echo "tag ${TAG_NAME} contains a tag-object cycle" >&2
                return 1
              }
              seen["$object_sha"]=1
              tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type // empty' <<<"$tag_json")"
              object_sha="$(jq -r '.object.sha // empty' <<<"$tag_json")"
            done
            [[ "$object_type" == "commit" ]] || {
              echo "tag ${TAG_NAME} has too many nested tag objects" >&2
              return 1
            }
            [[ "$object_sha" == "$GITHUB_SHA" ]] || {
              echo "tag ${TAG_NAME} resolves to ${object_sha}, expected ${GITHUB_SHA}" >&2
              return 1
            }
            printf 'Verified tag %s at commit %s\n' "$TAG_NAME" "$GITHUB_SHA"
          }

          require_latest_success() {
            local workflow="$1" event="$2" payload latest
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${GITHUB_SHA}&event=${event}&per_page=100")"
            latest="$(jq -c --arg sha "$GITHUB_SHA" --arg event "$event" '
              [.workflow_runs[]? | select(.head_sha == $sha and .event == $event)]
              | sort_by(.run_started_at // .created_at)
              | last // empty
            ' <<<"$payload")"
            [[ -n "$latest" ]] || {
              echo "no ${workflow} run for commit ${GITHUB_SHA} with event ${event}" >&2
              return 1
            }
            jq -e '.status == "completed" and .conclusion == "success"' \
              <<<"$latest" >/dev/null || {
                echo "latest ${workflow} run for ${GITHUB_SHA} is $(jq -r '.status + "/" + (.conclusion // "null")' <<<"$latest")" >&2
                return 1
              }
            printf '%s evidence: %s\n' "$workflow" "$(jq -r '.html_url' <<<"$latest")"
          }

          resolve_and_check_tag
          require_latest_success ci.yml push
          require_latest_success validation.yml workflow_dispatch

  wheels:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            runner_arch: x86_64
            wheel_platform_arch: x86_64
            cibw_arch: x86_64
            profile: multiarch
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            runner_arch: arm64
            wheel_platform_arch: aarch64
            cibw_arch: aarch64
            profile: portable
          - target: macos-x86_64
            runner: macos-15-intel
            runner_arch: x86_64
            wheel_platform_arch: x86_64
            cibw_arch: x86_64
            macos_deployment_target: "11.0"
            profile: portable
          - target: macos-arm64
            runner: macos-15
            runner_arch: arm64
            wheel_platform_arch: arm64
            cibw_arch: arm64
            macos_deployment_target: "11.0"
            profile: portable
          - target: windows-x86_64
            runner: windows-2025
            runner_arch: x86_64
            wheel_platform_arch: amd64
            cibw_arch: AMD64
            profile: portable
    runs-on: ${{ matrix.runner }}
    env:
      CIBW_ARCHS: ${{ matrix.cibw_arch }}
      CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
      CIBW_TEST_REQUIRES: "pytest>=8"
      CIBW_TEST_COMMAND: >-
        python -m pytest --ignore="{project}/tests/parity" "{project}/tests"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install build Python
        run: uv python install 3.14
      - name: Verify runner architecture
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: >-
          uv run --python 3.14 --no-project python -c
          "import os, platform; aliases = {'amd64': 'x86_64', 'x86_64': 'x86_64', 'arm64': 'arm64', 'aarch64': 'arm64'}; actual = aliases.get(platform.machine().lower(), platform.machine().lower()); expected = os.environ['EXPECTED_RUNNER_ARCH']; print(f'runner architecture: {platform.machine()} -> {actual}; expected {expected}'); assert actual == expected"
      - name: Sync locked release builder
        run: uv sync --locked --python 3.14 --group release --no-install-project
      - name: Build the CPython 3.11 wheel and test its installed wheel
        env:
          CIBW_BUILD: cp311-*
          CIBW_CONFIG_SETTINGS: cmake.define.SPHARM_CPP_BUILD_PROFILE=${{ matrix.profile }}
        run: uv run --locked --no-sync cibuildwheel --output-dir wheelhouse/cp311
      - name: Build the CPython 3.12+ abi3 wheel and test its installed wheel
        env:
          CIBW_BUILD: cp312-*
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.SPHARM_CPP_BUILD_PROFILE=${{ matrix.profile }}
            cmake.define.SPHARM_CPP_STABLE_ABI=ON
            wheel.py-api=cp312
        run: uv run --locked --no-sync cibuildwheel --output-dir wheelhouse/abi3
      - name: Build free-threaded wheels and test their installed wheels
        env:
          CIBW_BUILD: cp314t-* cp315t-*
          CIBW_CONFIG_SETTINGS: cmake.define.SPHARM_CPP_BUILD_PROFILE=${{ matrix.profile }}
        run: uv run --locked --no-sync cibuildwheel --output-dir wheelhouse/free-threaded
      - name: Verify wheel tags, architecture, and macOS deployment target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_WHEEL_ARCH: ${{ matrix.wheel_platform_arch }}
          MACOS_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: |
          uv run --locked --no-sync python - <<'PY'
          import os
          from pathlib import Path

          wheels = sorted(Path("wheelhouse").rglob("*.whl"))
          assert wheels, "cibuildwheel produced no wheels"
          expected_pairs = {
              ("cp311", "cp311"),
              ("cp312", "abi3"),
              ("cp314", "cp314t"),
              ("cp315", "cp315t"),
          }
          target = os.environ["TARGET"]
          arch = os.environ["EXPECTED_WHEEL_ARCH"]
          deployment = os.environ.get("MACOS_DEPLOYMENT_TARGET", "")
          if target.startswith("linux-"):
              expected_families = {"manylinux", "musllinux"}
          elif target.startswith("macos-"):
              expected_families = {"macos"}
          else:
              expected_families = {"windows"}
          expected = {
              (python_tag, abi_tag, family)
              for python_tag, abi_tag in expected_pairs
              for family in expected_families
          }
          actual = set()
          for wheel in wheels:
              _, python_tag, abi_tag, platform_tag = wheel.stem.rsplit("-", 3)
              platform_tags = platform_tag.split(".")
              wheel_families = set()
              if target.startswith("macos-"):
                  prefix = f"macosx_{deployment.replace('.', '_')}_"
                  assert any(
                      tag.startswith(prefix) and tag.endswith(f"_{arch}")
                      for tag in platform_tags
                  ), f"unexpected macOS target or architecture: {wheel.name}"
                  wheel_families.add("macos")
              elif target.startswith("linux-"):
                  for tag in platform_tags:
                      assert tag.endswith(f"_{arch}"), wheel.name
                      if tag.startswith("manylinux"):
                          wheel_families.add("manylinux")
                      elif tag.startswith("musllinux"):
                          wheel_families.add("musllinux")
                      else:
                          raise AssertionError(f"unexpected Linux wheel tag: {wheel.name}")
              else:
                  assert any(tag == f"win_{arch}" for tag in platform_tags), wheel.name
                  wheel_families.add("windows")
              assert len(wheel_families) == 1, (
                  f"mixed platform families in {wheel.name}: {wheel_families}"
              )
              actual.add((python_tag, abi_tag, next(iter(wheel_families))))
          assert len(wheels) == len(expected), (
              f"expected {len(expected)} wheels, found {len(wheels)}"
          )
          assert actual == expected, (
              f"wheel ABI matrix mismatch: missing={sorted(expected - actual)}, "
              f"unexpected={sorted(actual - expected)}"
          )
          print(f"Validated {len(wheels)} wheels for {target}")
          PY
      - name: Collect verified wheels for upload
        shell: bash
        run: |
          mkdir -p wheelhouse-artifact
          find wheelhouse -type f -name '*.whl' -exec cp {} wheelhouse-artifact/ \;
          expected=4
          case "${{ matrix.target }}" in
            linux-*) expected=8 ;;
          esac
          test "$(find wheelhouse-artifact -maxdepth 1 -name '*.whl' | wc -l)" -eq "$expected"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-wheels-${{ matrix.target }}
          path: wheelhouse-artifact/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked build tools
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --group build --group test --no-install-project
      - name: Build source distribution
        run: >-
          uv run --locked --no-sync --python 3.14 python -m build
          --sdist --no-isolation --outdir dist/sdist .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-sdist
          path: dist/sdist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [release-policy, wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.repository }}
      url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/p/pyspharm-cpp' || 'https://pypi.org/p/pyspharm-cpp' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm the release tag still points to the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}")"
          object_type="$(jq -r '.object.type // empty' <<<"$tag_json")"
          object_sha="$(jq -r '.object.sha // empty' <<<"$tag_json")"
          declare -A seen=()
          for _ in {1..16}; do
            [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid Git object for ${TAG_NAME}" >&2; exit 1; }
            [[ "$object_type" == "commit" ]] && break
            [[ "$object_type" == "tag" ]] || { echo "${TAG_NAME} resolves to ${object_type}, not a commit" >&2; exit 1; }
            [[ -z "${seen[$object_sha]:-}" ]] || { echo "tag-object cycle for ${TAG_NAME}" >&2; exit 1; }
            seen["$object_sha"]=1
            tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
            object_type="$(jq -r '.object.type // empty' <<<"$tag_json")"
            object_sha="$(jq -r '.object.sha // empty' <<<"$tag_json")"
          done
          [[ "$object_type" == "commit" && "$object_sha" == "$GITHUB_SHA" ]] || {
            echo "tag ${TAG_NAME} no longer resolves to tested commit ${GITHUB_SHA}" >&2
            exit 1
          }
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked release tools
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --group release --no-install-project
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate distribution metadata with Twine
        run: uv run --locked --no-sync twine check dist/*
      - name: Attest release files
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*
          subject-name: pyspharm-cpp
      - name: Recheck the release tag before package upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}")"
          object_type="$(jq -r '.object.type // empty' <<<"$tag_json")"
          object_sha="$(jq -r '.object.sha // empty' <<<"$tag_json")"
          declare -A seen=()
          for _ in {1..16}; do
            [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid Git object for ${TAG_NAME}" >&2; exit 1; }
            [[ "$object_type" == "commit" ]] && break
            [[ "$object_type" == "tag" ]] || { echo "${TAG_NAME} resolves to ${object_type}, not a commit" >&2; exit 1; }
            [[ -z "${seen[$object_sha]:-}" ]] || { echo "tag-object cycle for ${TAG_NAME}" >&2; exit 1; }
            seen["$object_sha"]=1
            tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
            object_type="$(jq -r '.object.type // empty' <<<"$tag_json")"
            object_sha="$(jq -r '.object.sha // empty' <<<"$tag_json")"
          done
          [[ "$object_type" == "commit" && "$object_sha" == "$GITHUB_SHA" ]] || {
            echo "tag ${TAG_NAME} no longer resolves to tested commit ${GITHUB_SHA}" >&2
            exit 1
          }
      - name: Publish to the selected package index
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  github-release:
    if: github.ref_type == 'tag' && !contains(github.ref_name, '.dev')
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release after successful PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
