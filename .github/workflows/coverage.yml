name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: C++ coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DUCC0_NUM_THREADS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install coverage dependencies
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --no-install-project
      - name: Build instrumented C++ wheel
        run: >-
          uv run --locked --no-sync --python 3.14 python -m build
          --wheel --no-isolation
          --config-setting cmake.define.SPHARM_CPP_BUILD_PROFILE=portable
          --config-setting cmake.define.SPHARM_CPP_ENABLE_COVERAGE=ON
          --config-setting cmake.define.CMAKE_EXPORT_COMPILE_COMMANDS=ON
          --outdir dist/coverage .
      - name: Install and test instrumented wheel
        run: |
          wheel_venv="/tmp/pyspharm-cpp-coverage-wheel"
          uv venv --python 3.14 "$wheel_venv"
          uv pip install --python "$wheel_venv/bin/python" \
            dist/coverage/*.whl "pytest>=8"
          cd /tmp
          "$wheel_venv/bin/python" -m pytest -q \
            --ignore="$GITHUB_WORKSPACE/tests/parity" "$GITHUB_WORKSPACE/tests" \
            -o junit_family=legacy --junitxml="$GITHUB_WORKSPACE/test-results.xml"
      - name: Generate C++ coverage reports
        run: >-
          uv run --locked --no-sync gcovr --root "$GITHUB_WORKSPACE"
          --filter '.*src/cpp/.*\.(cpp|hpp)$'
          --merge-mode-functions=merge-use-line-min
          --print-summary --lcov coverage.lcov --xml-pretty --output coverage.xml
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-cpp-coverage
          path: |
            coverage.lcov
            coverage.xml
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-results.xml
          flags: cpp-coverage-tests
          fail_ci_if_error: false
