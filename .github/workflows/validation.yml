name: Parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyspharm-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity:
    name: PySpharm parity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: .github/conda/pyspharm.yml
          activate-environment: pyspharm-reference
          auto-activate: false
          channel-priority: strict
      - name: Install C++ extension
        run: conda run -n pyspharm-reference python -m pip install --no-build-isolation --no-deps -e .
      - name: Run parity tests
        env:
          PYSPHARM_VALIDATION_DIR: ${{ runner.temp }}/pyspharm-validation
        run: >-
          conda run --no-capture-output -n pyspharm-reference python -m pytest
          -v -o addopts=-ra tests/parity
          --junitxml=${{ runner.temp }}/pyspharm-validation/pytest-cases.xml
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ${{ runner.temp }}/pyspharm-validation/pytest-cases.xml
          flags: pyspharm-parity
          fail_ci_if_error: false
      - name: Upload parity reports
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pyspharm-validation-${{ github.sha }}
          path: ${{ runner.temp }}/pyspharm-validation/
          if-no-files-found: warn
