# SPDX-License-Identifier: GPL-2.0-or-later
name: Parity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyspharm-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity:
    name: PySpharm parity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install CPython 3.12
        run: uv python install 3.12
      - name: Prepare validation reports
        run: |
          echo "PYSPHARM_VALIDATION_DIR=$RUNNER_TEMP/pyspharm-validation" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pyspharm-validation"
      - name: Install validation dependencies and verify reference wheels
        run: >-
          uv sync --locked --python 3.12 --group validation --no-build-package pyspharm-syl
      - name: Run API and numerical parity tests
        run: |
          uv run --locked --no-sync python -m pytest -v -s \
            -o addopts=-ra \
            --junitxml="$PYSPHARM_VALIDATION_DIR/pytest-cases.xml" \
            tests/parity
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ${{ runner.temp }}/pyspharm-validation/pytest-cases.xml
          flags: pyspharm-parity
          fail_ci_if_error: false
      - name: Upload parity reports
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pyspharm-validation-${{ github.sha }}
          path: ${{ runner.temp }}/pyspharm-validation/
          if-no-files-found: warn
