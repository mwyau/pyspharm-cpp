# SPDX-License-Identifier: GPL-2.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DUCC0_NUM_THREADS: "2"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install editable package and test dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Report CPU build profile
        run: uv run --locked python -c "import spharm_cpp; print('spharm_cpp.cpu_info():', spharm_cpp.cpu_info())"
      - name: Run API and numerical tests
        run: >-
          uv run --locked python -m pytest -q
          -o junit_family=legacy --junitxml=test-results.xml
      - name: Test CPU dispatch regressions
        if: matrix.python-version == '3.14'
        run: |
          for cap in 1 3 4; do
            active=$(DUCC0_MAX_PSABI_LEVEL=$cap .venv/bin/python -c "import spharm_cpp; print(spharm_cpp.cpu_info()['active_profile'])")
            echo "DUCC0_MAX_PSABI_LEVEL=$cap: $active"
            if [ "$cap" = "4" ] && [ "$active" != "x86-64-v4" ]; then
              echo "Runner does not support x86-64-v4; skipping v4 tests"
              continue
            fi
            DUCC0_MAX_PSABI_LEVEL=$cap .venv/bin/python -m pytest -q \
              tests/test_numerics.py::test_batched_interpolation_high_order_phase_and_periodicity \
              tests/test_numerics.py::test_batched_interpolation_complex_coefficient_all_eight_lanes
          done
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-results.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false

  build-profiles:
    name: Wheel ${{ matrix.profile }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: portable
            python-version: "3.14"
          - profile: native
            python-version: "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync locked build and test tools
        run: uv sync --locked --python ${{ matrix.python-version }} --no-install-project
      - name: Build wheel
        run: >-
          uv run --locked --no-sync --python ${{ matrix.python-version }} python -m build
          --wheel --no-isolation
          --config-setting cmake.define.SPHARM_CPP_BUILD_PROFILE=${{ matrix.profile }}
          --outdir dist/${{ matrix.profile }} .
      - name: Install and test wheel
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/${{ matrix.profile }}/*.whl
          .venv/bin/python -c "import spharm_cpp; print('spharm_cpp.cpu_info():', spharm_cpp.cpu_info())"
          .venv/bin/python -m pytest -q -o junit_family=legacy --junitxml=test-results.xml
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-results.xml
          flags: wheel-${{ matrix.profile }}-python-${{ matrix.python-version }}
          fail_ci_if_error: false
      - name: Prepare profile-specific wheel filename
        run: >-
          uv run --locked --no-sync python .github/prepare_wheel_artifacts.py
          dist/${{ matrix.profile }} dist/artifact ${{ matrix.profile }}
          --expected 1
      - name: Upload tested ${{ matrix.profile }} wheel
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/artifact/*.whl
          if-no-files-found: error
          archive: false

  stable-abi-build:
    name: ABI3 wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install CPython 3.12 and locked build tools
        run: |
          uv python install 3.12
          uv sync --locked --python 3.12 --no-install-project
      - name: Build Linux multiarch abi3 wheel
        run: >-
          uv run --locked --no-sync --python 3.12 python -m build
          --wheel --no-isolation
          --config-setting cmake.define.SPHARM_CPP_BUILD_PROFILE=multiarch
          --config-setting cmake.define.SPHARM_CPP_STABLE_ABI=ON
          --config-setting wheel.py-api=cp312 --outdir dist/abi3 .
      - name: Verify abi3 wheel tag
        run: |
          wheel="$(find dist/abi3 -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          case "$wheel" in
            *-cp312-abi3-*) ;;
            *) echo "Expected a cp312-abi3 wheel, found $wheel"; exit 1 ;;
          esac
      - name: Upload abi3 wheel
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/abi3/*.whl
          if-no-files-found: error
          archive: false

  stable-abi-tests:
    name: ABI3 (Python ${{ matrix.python-version }})
    needs: [stable-abi-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install test Python
        run: uv python install ${{ matrix.python-version }}
      - name: Download abi3 wheel
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: "*-cp312-abi3-linux_x86_64.whl"
          merge-multiple: true
          path: dist/abi3
      - name: Install and test abi3 wheel
        run: |
          test "$(find dist/abi3 -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          wheel="$(find dist/abi3 -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_venv="/tmp/pyspharm-cpp-abi3-${{ matrix.python-version }}"
          uv venv --python ${{ matrix.python-version }} "$wheel_venv"
          uv pip install --python "$wheel_venv/bin/python" "$wheel" "pytest>=8"
          cd /tmp
          "$wheel_venv/bin/python" -c \
            "import spharm_cpp._spharm_cpp as ext; print(ext.__file__); assert ext.__file__.endswith('_spharm_cpp.abi3.so')"
          "$wheel_venv/bin/python" -m pytest -q \
            --ignore="$GITHUB_WORKSPACE/tests/parity" "$GITHUB_WORKSPACE/tests" \
            -o junit_family=legacy --junitxml="$GITHUB_WORKSPACE/test-results.xml"
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            for cap in 1 3 4; do
              DUCC0_MAX_PSABI_LEVEL=$cap "$wheel_venv/bin/python" -m pytest -q \
                "$GITHUB_WORKSPACE/tests/test_numerics.py::test_batched_interpolation_high_order_phase_and_periodicity" \
                "$GITHUB_WORKSPACE/tests/test_numerics.py::test_batched_interpolation_complex_coefficient_all_eight_lanes"
            done
          fi
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-results.xml
          flags: abi3-python-${{ matrix.python-version }}
          fail_ci_if_error: false

  pip-sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked build tools
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --no-install-project
      - name: Build source distribution
        run: >-
          uv run --locked --no-sync --python 3.14 python -m build
          --sdist --no-isolation --outdir dist/sdist .
      - name: Install source distribution with pip
        run: |
          uv run --python 3.14 --no-project python -m venv /tmp/pyspharm-cpp-pip-env
          /tmp/pyspharm-cpp-pip-env/bin/python -m pip install dist/sdist/*.tar.gz
          /tmp/pyspharm-cpp-pip-env/bin/python -m pip install "pytest>=8"
          /tmp/pyspharm-cpp-pip-env/bin/python -m pip check
          cd /tmp
          /tmp/pyspharm-cpp-pip-env/bin/python -c "import spharm_cpp; print(spharm_cpp.__version__, spharm_cpp.cpu_info())"
          /tmp/pyspharm-cpp-pip-env/bin/python -m pytest -q \
            --ignore="$GITHUB_WORKSPACE/tests/parity" "$GITHUB_WORKSPACE/tests" \
            -o junit_family=legacy --junitxml="$GITHUB_WORKSPACE/test-results.xml"
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-results.xml
          flags: source-distribution
          fail_ci_if_error: false
      - name: Upload tested source distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/sdist/*.tar.gz
          if-no-files-found: error
          archive: false

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked quality tools
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14
      - name: Check lint, types, and formatting
        run: |
          uv run --locked --no-sync ruff check src tests typing docs .github/check_spdx.py
          uv run --locked --no-sync ruff format --check src tests typing docs .github/check_spdx.py
          uv run --locked --no-sync ty check typing/consumer.py
          uv run --locked --no-sync clang-format --dry-run --Werror \
            src/cpp/module.cpp src/cpp/bindings.cpp src/cpp/transforms.cpp \
            src/cpp/numerics.cpp src/cpp/internal.hpp
      - name: Check generated nanobind stub
        run: |
          stubdir="$(mktemp -d)"
          uv run --locked --no-sync python -m nanobind.stubgen \
            -m spharm_cpp._spharm_cpp -O "$stubdir" \
            -M "$stubdir/py.typed" -p .github/stubgen-patterns.txt
          uv run --locked --no-sync ruff format "$stubdir/_spharm_cpp.pyi"
          uv run --locked --no-sync ruff check --fix "$stubdir/_spharm_cpp.pyi"
          diff -u src/spharm_cpp/_spharm_cpp.pyi "$stubdir/_spharm_cpp.pyi"
          cmp src/spharm_cpp/py.typed "$stubdir/py.typed"
      - name: Check SPDX identifiers and lockfile
        run: |
          uv run --locked --no-sync python .github/check_spdx.py
          uv lock --check
      - name: Run pre-commit checks
        run: uv run --locked --no-sync prek run --all-files --show-diff-on-failure
      - name: Audit GitHub Actions workflows
        run: uv run --locked --no-sync zizmor .github/workflows

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked build and documentation tools
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14
      - name: Build documentation with warnings as errors
        run: >-
          uv run --locked --no-sync python -m sphinx -n -W --keep-going
          -b html docs docs/_build/html
      - name: Check documentation navigation and math
        run: uv run --locked --no-sync python .github/check_docs.py

  clang-tidy:
    name: C++ analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Clang tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked native build dependencies
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --no-install-project
      - name: Generate Clang compilation database
        run: |
          nanobind_dir="$(uv run --locked --no-sync python -m nanobind --cmake_dir)"
          python_executable="$(uv run --locked --no-sync python -c 'import sys; print(sys.executable)')"
          CC=clang CXX=clang++ uv run --locked --no-sync cmake \
            -S . -B build/clang-tidy -G Ninja \
            -DPython_EXECUTABLE="$python_executable" \
            -Dnanobind_DIR="$nanobind_dir" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSPHARM_CPP_BUILD_PROFILE=portable
      - name: Analyze C++ sources with clang-tidy
        run: |
          clang-tidy -p build/clang-tidy \
            src/cpp/module.cpp src/cpp/bindings.cpp \
            src/cpp/transforms.cpp src/cpp/numerics.cpp

  free-threaded-wheels:
    name: Free-threaded (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14t", "3.15t"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install free-threaded Python and locked build and test tools
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --locked --python ${{ matrix.python-version }}
      - name: Test free-threaded editable install
        run: |
          uv run --locked --python ${{ matrix.python-version }} python -c \
            "import sys; assert not sys._is_gil_enabled()"
          uv run --locked --python ${{ matrix.python-version }} python -m pytest -q \
            -o junit_family=legacy --junitxml=test-results-editable.xml
      - name: Build portable free-threaded wheel
        run: >-
          uv run --locked --no-sync --python ${{ matrix.python-version }}
          python -m build --wheel --no-isolation
          --config-setting cmake.define.SPHARM_CPP_BUILD_PROFILE=portable
          --outdir dist/free-threaded .
      - name: Install and test free-threaded wheel
        run: |
          wheel_venv="/tmp/pyspharm-${{ matrix.python-version }}-wheel-env"
          uv venv --python ${{ matrix.python-version }} "$wheel_venv"
          uv pip install --python "$wheel_venv/bin/python" \
            dist/free-threaded/*.whl "pytest>=8"
          cd /tmp
          "$wheel_venv/bin/python" -c \
            "import sys, sysconfig, spharm_cpp; assert sysconfig.get_config_var('Py_GIL_DISABLED'); assert not sys._is_gil_enabled(); print(spharm_cpp.cpu_info())"
          "$wheel_venv/bin/python" -m pytest -q \
            --ignore="$GITHUB_WORKSPACE/tests/parity" "$GITHUB_WORKSPACE/tests" \
            -o junit_family=legacy --junitxml="$GITHUB_WORKSPACE/test-results-wheel.xml"
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-results-editable.xml,test-results-wheel.xml
          flags: free-threaded-${{ matrix.python-version }}
          fail_ci_if_error: false
      - name: Upload tested free-threaded wheel
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/free-threaded/*.whl
          if-no-files-found: error
          archive: false

  wheels:
    name: Distribution wheels
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/wheels.yml
