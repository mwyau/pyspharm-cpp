# SPDX-License-Identifier: GPL-2.0-or-later
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DUCC0_NUM_THREADS: "2"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync locked environment and install editable package
        run: >-
          uv sync --locked --python ${{ matrix.python-version }}
          --group build --group test
      - name: Report selected CPU profile
        run: uv run --locked python -c "import spharm_cpp; print('spharm_cpp.cpu_info():', spharm_cpp.cpu_info())"
      - name: Run numerical and API tests
        run: uv run --locked python -m pytest -q

  build-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [portable, native, multiarch]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python
        run: uv python install 3.14
      - name: Sync locked build and test tools
        run: >-
          uv sync --locked --python 3.14 --group build --group test
          --no-install-project
      - name: Build wheel
        run: >-
          uv run --locked --no-sync --python 3.14 python -m build
          --wheel --no-isolation
          --config-setting cmake.define.SPHARM_CPP_BUILD_PROFILE=${{ matrix.profile }}
          --outdir dist/${{ matrix.profile }} .
      - name: Install and test wheel
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/${{ matrix.profile }}/*.whl
          .venv/bin/python -c "import spharm_cpp; print('spharm_cpp.cpu_info():', spharm_cpp.cpu_info())"
          .venv/bin/python -m pytest -q
          if [ "${{ matrix.profile }}" = "multiarch" ]; then
            for cap in 1 3 4; do
              echo "Testing interpolation phase regression with DUCC0_MAX_PSABI_LEVEL=$cap"
              DUCC0_MAX_PSABI_LEVEL=$cap .venv/bin/python -c "import spharm_cpp; print('spharm_cpp.cpu_info():', spharm_cpp.cpu_info())"
              active_profile=$(DUCC0_MAX_PSABI_LEVEL=$cap .venv/bin/python -c "import spharm_cpp; print(spharm_cpp.cpu_info()['active_profile'])")
              if [ "$cap" = "4" ] && [ "$active_profile" != "x86-64-v4" ]; then
                echo "AVX-512 v4 unavailable on this runner; v4 interpolation not tested"
                continue
              fi
              DUCC0_MAX_PSABI_LEVEL=$cap .venv/bin/python -m pytest -q \
                tests/test_numerics.py::test_batched_interpolation_high_order_phase_and_periodicity \
                tests/test_numerics.py::test_batched_interpolation_complex_coefficient_all_eight_lanes
            done
          fi

  stable-abi-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install CPython 3.12 and locked build tools
        run: |
          uv python install 3.12
          uv sync --locked --python 3.12 --group build --group test --no-install-project
      - name: Build one Linux multiarch cp312-abi3 wheel
        run: >-
          uv run --locked --no-sync --python 3.12 python -m build
          --wheel --no-isolation
          --config-setting cmake.define.SPHARM_CPP_BUILD_PROFILE=multiarch
          --config-setting cmake.define.SPHARM_CPP_STABLE_ABI=ON
          --config-setting wheel.py-api=cp312 --outdir dist/abi3 .
      - name: Verify the stable ABI wheel tag
        run: |
          wheel="$(find dist/abi3 -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          case "$wheel" in
            *-cp312-abi3-*) ;;
            *) echo "Expected a cp312-abi3 wheel, found $wheel"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cp312-abi3-linux-x86_64
          path: dist/abi3/*.whl
          if-no-files-found: error

  stable-abi-tests:
    needs: [stable-abi-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install test Python
        run: uv python install ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: cp312-abi3-linux-x86_64
          path: dist/abi3
      - name: Install the same abi3 wheel and test it outside the checkout
        run: |
          wheel="$(find dist/abi3 -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          wheel_venv="/tmp/pyspharm-cpp-abi3-${{ matrix.python-version }}"
          uv venv --python ${{ matrix.python-version }} "$wheel_venv"
          uv pip install --python "$wheel_venv/bin/python" "$wheel" "pytest>=8"
          cd /tmp
          "$wheel_venv/bin/python" -c \
            "import spharm_cpp._spharm_cpp as ext; print(ext.__file__); assert ext.__file__.endswith('_spharm_cpp.abi3.so')"
          "$wheel_venv/bin/python" -m pytest -q \
            --ignore="$GITHUB_WORKSPACE/tests/parity" "$GITHUB_WORKSPACE/tests"
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            for cap in 1 3 4; do
              DUCC0_MAX_PSABI_LEVEL=$cap "$wheel_venv/bin/python" -m pytest -q \
                "$GITHUB_WORKSPACE/tests/test_numerics.py::test_batched_interpolation_high_order_phase_and_periodicity" \
                "$GITHUB_WORKSPACE/tests/test_numerics.py::test_batched_interpolation_complex_coefficient_all_eight_lanes"
            done
          fi

  pip-sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked build tools
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --group build --group test --no-install-project
      - name: Build source distribution
        run: >-
          uv run --locked --no-sync --python 3.14 python -m build
          --sdist --no-isolation --outdir dist/sdist .
      - name: Install source distribution with ordinary pip
        run: |
          uv run --python 3.14 --no-project python -m venv /tmp/pyspharm-cpp-pip-env
          /tmp/pyspharm-cpp-pip-env/bin/python -m pip install dist/sdist/*.tar.gz
          /tmp/pyspharm-cpp-pip-env/bin/python -m pip install "pytest>=8"
          /tmp/pyspharm-cpp-pip-env/bin/python -m pip check
          cd /tmp
          /tmp/pyspharm-cpp-pip-env/bin/python -c "import spharm_cpp; print(spharm_cpp.__version__, spharm_cpp.cpu_info())"
          /tmp/pyspharm-cpp-pip-env/bin/python -m pytest -q \
            --ignore="$GITHUB_WORKSPACE/tests/parity" "$GITHUB_WORKSPACE/tests"

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked quality tools
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --all-groups
      - name: Check Python lint, formatting, types, and C++ formatting
        run: |
          uv run --locked --no-sync ruff check src tests typing docs .github/check_spdx.py
          uv run --locked --no-sync ruff format --check src tests typing docs .github/check_spdx.py
          uv run --locked --no-sync ty check typing/consumer.py
          uv run --locked --no-sync clang-format --dry-run --Werror \
            src/cpp/module.cpp src/cpp/bindings.cpp src/cpp/transforms.cpp \
            src/cpp/numerics.cpp src/cpp/internal.hpp
      - name: Check generated nanobind stub
        run: |
          stubdir="$(mktemp -d)"
          uv run --locked --no-sync python -m nanobind.stubgen \
            -m spharm_cpp._spharm_cpp -O "$stubdir" \
            -M "$stubdir/py.typed" -p .github/stubgen-patterns.txt
          uv run --locked --no-sync ruff format "$stubdir/_spharm_cpp.pyi"
          uv run --locked --no-sync ruff check --fix "$stubdir/_spharm_cpp.pyi"
          diff -u src/spharm_cpp/_spharm_cpp.pyi "$stubdir/_spharm_cpp.pyi"
          cmp src/spharm_cpp/py.typed "$stubdir/py.typed"
      - name: Check SPDX identifiers and lockfile
        run: |
          uv run --locked --no-sync python .github/check_spdx.py
          uv lock --check
      - name: Run pre-commit-compatible hooks
        run: uv run --locked --no-sync prek run --all-files --show-diff-on-failure
      - name: Audit workflows
        run: uv run --locked --no-sync zizmor .github/workflows

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked build and documentation tools
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --group build --group docs
      - name: Build documentation with warnings as errors
        run: >-
          uv run --locked --no-sync python -m sphinx -n -W --keep-going
          -b html docs docs/_build/html

  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Clang tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install Python and locked native build dependencies
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14 --group build --no-install-project
      - name: Generate portable Clang compilation database
        run: |
          nanobind_dir="$(uv run --locked --no-sync python -m nanobind --cmake_dir)"
          python_executable="$(uv run --locked --no-sync python -c 'import sys; print(sys.executable)')"
          CC=clang CXX=clang++ uv run --locked --no-sync cmake \
            -S . -B build/clang-tidy -G Ninja \
            -DPython_EXECUTABLE="$python_executable" \
            -Dnanobind_DIR="$nanobind_dir" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSPHARM_CPP_BUILD_PROFILE=portable
      - name: Analyze first-party C++ translation units
        run: |
          clang-tidy -p build/clang-tidy \
            src/cpp/module.cpp src/cpp/bindings.cpp \
            src/cpp/transforms.cpp src/cpp/numerics.cpp

  free-threaded-wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install free-threaded Python and locked build and test tools
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --locked --python ${{ matrix.python-version }} --group build --group test
      - name: Verify editable install and run full free-threaded tests
        run: |
          uv run --locked --python ${{ matrix.python-version }} python -c \
            "import sys; assert not sys._is_gil_enabled()"
          uv run --locked --python ${{ matrix.python-version }} python -m pytest -q
      - name: Build a portable free-threaded wheel
        run: >-
          uv run --locked --no-sync --python ${{ matrix.python-version }}
          python -m build --wheel --no-isolation
          --config-setting cmake.define.SPHARM_CPP_BUILD_PROFILE=portable
          --outdir dist/free-threaded .
      - name: Install and test the free-threaded wheel outside the checkout
        run: |
          wheel_venv="/tmp/pyspharm-${{ matrix.python-version }}-wheel-env"
          uv venv --python ${{ matrix.python-version }} "$wheel_venv"
          uv pip install --python "$wheel_venv/bin/python" \
            dist/free-threaded/*.whl "pytest>=8"
          cd /tmp
          "$wheel_venv/bin/python" -c \
            "import sys, sysconfig, spharm_cpp; assert sysconfig.get_config_var('Py_GIL_DISABLED'); assert not sys._is_gil_enabled(); print(spharm_cpp.cpu_info())"
          "$wheel_venv/bin/python" -m pytest -q \
            --ignore="$GITHUB_WORKSPACE/tests/parity" "$GITHUB_WORKSPACE/tests"
