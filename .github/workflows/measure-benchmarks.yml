# SPDX-License-Identifier: GPL-2.0-or-later
name: Measure SHT benchmarks

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/measure-benchmarks.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Install CPython and SPHEREPACK reference
        run: |
          uv python install 3.12
          uv sync --locked --python 3.12 --group build --group test --group validation --no-build-package pyspharm-syl
          uv pip install --python .venv/bin/python "ducc0==0.42.0"
      - name: Inspect CPU and SIMD
        run: |
          nproc
          lscpu | grep -E "Model name|CPU\(s\):|Flags:"
          cat /sys/fs/cgroup/cpu.max || true
      - name: Require AVX-512 dispatch
        run: |
          uv run --locked --no-sync python - <<'PY'
          import spharm_cpp
          info = spharm_cpp.cpu_info()
          print("CPU_DISPATCH=", info, flush=True)
          if info.get("active_profile") != "x86-64-v4":
              raise SystemExit("AVX-512 v4 unavailable on this runner; rerun the job")
          PY
      - name: Measure four grids (4 threads)
        run: |
          mkdir -p "$RUNNER_TEMP/sht-bench"
          uv run --locked --no-sync python benchmarks/benchmark.py \
            --threads 4 --warmups 2 --repeats 7 \
            --output "$RUNNER_TEMP/sht-bench/four-thread.csv"
      - name: Measure 2.5-degree regular grid (1 thread)
        run: |
          uv run --locked --no-sync python benchmarks/benchmark.py \
            --cases cc-2p5-1t --threads 1 --warmups 2 --repeats 7 \
            --output "$RUNNER_TEMP/sht-bench/one-thread.csv"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: five-grid-sht-bench-${{ github.sha }}
          path: ${{ runner.temp }}/sht-bench/
          if-no-files-found: warn
