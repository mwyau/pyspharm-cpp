name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: SHT benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Verify eight CPUs are available
        run: |
          python3 - <<'PY'
          import math
          import os
          from pathlib import Path

          affinity = len(os.sched_getaffinity(0))
          quota = None
          try:
              value, period = Path("/sys/fs/cgroup/cpu.max").read_text().split()
              if value != "max":
                  quota = int(value) / int(period)
          except (OSError, ValueError):
              try:
                  value = int(Path(
                      "/sys/fs/cgroup/cpu/cpu.cfs_quota_us"
                  ).read_text())
                  period = int(Path(
                      "/sys/fs/cgroup/cpu/cpu.cfs_period_us"
                  ).read_text())
                  if value > 0:
                      quota = value / period
              except (OSError, ValueError):
                  pass

          available = min(affinity, math.floor(quota) if quota is not None else affinity)
          print(f"CPU allocation: affinity={affinity}, quota={quota}, available={available}")
          if available < 8:
              raise SystemExit(
                  "This configured ubuntu-24.04 runner provides fewer than eight CPUs. "
                  "Configure an eight-CPU runner before measuring; no runner label is "
                  "assumed here."
              )
          PY
      - name: Check AVX-512 hardware support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cpuinfo = Path("/proc/cpuinfo").read_text().lower()
          flags = set(next(line.split(":", 1)[1].split()
                           for line in cpuinfo.splitlines()
                           if line.startswith("flags")))
          needed = {"avx512f", "avx512dq", "avx512bw", "avx512vl"}
          if not needed.issubset(flags):
              raise SystemExit("Runner is not AVX-512 x86-64-v4 capable; rerun")
          print("Runner advertises AVX-512F/DQ/BW/VL")
          PY
      - name: Install CPython and benchmark dependencies
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --group benchmark \
            --no-install-project --no-install-package pyspharm
          FFLAGS="-fallow-argument-mismatch" \
            uv pip install --python .venv/bin/python \
              --no-build-isolation --no-deps "pyspharm==1.0.9"
          FFLAGS="-fallow-argument-mismatch" \
            uv sync --locked --python 3.11 --group benchmark --no-build-isolation
      - name: Inspect CPU and SIMD features
        run: |
          nproc
          lscpu | grep -E "Model name|CPU\(s\):|Flags:"
          cat /sys/fs/cgroup/cpu.max || true
      - name: Verify AVX-512 dispatch
        run: |
          uv run --locked --no-sync --python 3.11 python - <<'PY'
          import spharm_cpp
          info = spharm_cpp.cpu_info()
          print("CPU_DISPATCH=", info, flush=True)
          if info.get("active_profile") != "x86-64-v4":
              raise SystemExit("AVX-512 v4 unavailable on this runner; rerun the job")
          PY
      - name: Measure four grids (8 threads)
        run: |
          mkdir -p "$RUNNER_TEMP/sht-bench"
          uv run --locked --no-sync --python 3.11 python benchmarks/benchmark.py \
            --threads 8 --warmups 2 --repeats 7 \
            --output "$RUNNER_TEMP/sht-bench/eight-thread.csv"
      - name: Measure 2.5-degree regular grid (1 thread)
        run: |
          uv run --locked --no-sync --python 3.11 python benchmarks/benchmark.py \
            --cases cc-2p5-1t --threads 1 --warmups 2 --repeats 7 \
            --output "$RUNNER_TEMP/sht-bench/one-thread.csv"
      - name: Plot benchmark comparisons
        run: |
          uv run --locked --no-sync --python 3.11 python benchmarks/plot.py \
            --csv "$RUNNER_TEMP/sht-bench/eight-thread.csv" \
                  "$RUNNER_TEMP/sht-bench/one-thread.csv" \
            --output-dir "$RUNNER_TEMP/sht-bench/figures"
          test "$(find "$RUNNER_TEMP/sht-bench/figures" -name 'timings-*.svg' | wc -l)" -eq 5
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: five-grid-sht-bench-${{ github.sha }}
          path: ${{ runner.temp }}/sht-bench/
          if-no-files-found: warn
