name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: SHT benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Check AVX-512 hardware support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cpuinfo = Path("/proc/cpuinfo").read_text().lower()
          flags = set(next(line.split(":", 1)[1].split()
                           for line in cpuinfo.splitlines()
                           if line.startswith("flags")))
          needed = {"avx512f", "avx512dq", "avx512bw", "avx512vl"}
          if not needed.issubset(flags):
              raise SystemExit("Runner is not AVX-512 x86-64-v4 capable; rerun")
          print("Runner advertises AVX-512F/DQ/BW/VL")
          PY
      - name: Install CPython and benchmark dependencies
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --group benchmark \
            --no-install-project --no-install-package pyspharm
          uv run --locked --no-sync --python 3.11 python - <<'PY'
          from importlib.metadata import version

          setuptools_version = version("setuptools")
          if setuptools_version != "84.1.0":
              raise SystemExit(
                  f"Expected patched setuptools 84.1.0, found {setuptools_version}"
              )
          PY
          FFLAGS="-fallow-argument-mismatch" \
            uv pip install --python .venv/bin/python \
              --no-build-isolation --no-deps --no-binary pyspharm \
              "pyspharm==1.0.9"
          FFLAGS="-fallow-argument-mismatch" \
            uv sync --locked --python 3.11 --group benchmark --no-build-isolation
      - name: Inspect CPU and SIMD features
        run: |
          nproc
          lscpu | grep -E "Model name|CPU\(s\):|Flags:"
          cat /sys/fs/cgroup/cpu.max || true
      - name: Verify AVX-512 dispatch
        run: |
          uv run --locked --no-sync --python 3.11 python - <<'PY'
          import spharm_cpp
          info = spharm_cpp.cpu_info()
          print("CPU_DISPATCH=", info, flush=True)
          if info.get("active_profile") != "x86-64-v4":
              raise SystemExit("AVX-512 v4 unavailable on this runner; rerun the job")
          if set(info.get("compiled_profiles", [])) != {
              "x86-64-v1", "x86-64-v3", "x86-64-v4"
          }:
              raise SystemExit("Expected multiarch v1/v3/v4 build")
          PY
      - name: Benchmark v1, v3, and v4
        run: |
          for cap in 1 3 4; do
            output="$RUNNER_TEMP/sht-bench/v$cap"
            mkdir -p "$output"
            DUCC0_MAX_PSABI_LEVEL="$cap" uv run --locked --no-sync --python 3.11 \
              python -c "import spharm_cpp; assert spharm_cpp.cpu_info()['active_profile'] == 'x86-64-v$cap'"
            DUCC0_MAX_PSABI_LEVEL="$cap" uv run --locked --no-sync --python 3.11 \
              python benchmarks/benchmark.py --threads 0 --warmups 2 --repeats 7 \
              --output "$output/multi-thread.csv"
            DUCC0_MAX_PSABI_LEVEL="$cap" uv run --locked --no-sync --python 3.11 \
              python benchmarks/benchmark.py --cases cc-2p5-1t --threads 1 \
              --warmups 2 --repeats 7 --output "$output/one-thread.csv"
            uv run --locked --no-sync --python 3.11 python benchmarks/plot.py \
              --csv "$output/multi-thread.csv" "$output/one-thread.csv" \
              --output-dir "$output/figures"
            test "$(find "$output/figures" -name 'timings-*.svg' | wc -l)" -eq 5
          done
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: five-grid-sht-bench-${{ github.sha }}
          path: ${{ runner.temp }}/sht-bench/
          if-no-files-found: warn
