# SPDX-License-Identifier: GPL-2.0-or-later
name: Measure SHT benchmarks

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/measure-benchmarks.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: 0.13.5
      - name: Require AVX-512 hardware before building
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cpuinfo = Path("/proc/cpuinfo").read_text().lower()
          flags = set(next(line.split(":", 1)[1].split()
                           for line in cpuinfo.splitlines()
                           if line.startswith("flags")))
          needed = {"avx512f", "avx512dq", "avx512bw", "avx512vl"}
          if not needed.issubset(flags):
              raise SystemExit("Runner is not AVX-512 x86-64-v4 capable; rerun")
          print("Runner advertises AVX-512F/DQ/BW/VL")
          PY
      - name: Install CPython and SPHEREPACK reference
        run: |
          uv python install 3.12
          uv sync --locked --python 3.12 --group build --group test --group validation --no-build-package pyspharm-syl
          uv pip install --python .venv/bin/python "ducc0==0.42.0"
      - name: Inspect CPU and SIMD
        run: |
          nproc
          lscpu | grep -E "Model name|CPU\(s\):|Flags:"
          cat /sys/fs/cgroup/cpu.max || true
      - name: Require AVX-512 dispatch
        run: |
          uv run --locked --no-sync python - <<'PY'
          import spharm_cpp
          info = spharm_cpp.cpu_info()
          print("CPU_DISPATCH=", info, flush=True)
          if info.get("active_profile") != "x86-64-v4":
              raise SystemExit("AVX-512 v4 unavailable on this runner; rerun the job")
          PY
      - name: Measure four grids (4 threads)
        run: |
          mkdir -p "$RUNNER_TEMP/sht-bench"
          uv run --locked --no-sync python benchmarks/benchmark.py \
            --threads 4 --warmups 2 --repeats 7 \
            --output "$RUNNER_TEMP/sht-bench/four-thread.csv"
      - name: Measure 2.5-degree regular grid (1 thread)
        run: |
          uv run --locked --no-sync python benchmarks/benchmark.py \
            --cases cc-2p5-1t --threads 1 --warmups 2 --repeats 7 \
            --output "$RUNNER_TEMP/sht-bench/one-thread.csv"
      - name: Verify all five cases and the measured thread counts
        run: |
          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "sht-bench"
          four = {"cc-2p5", "cc-0p25", "gl-128", "gl-640"}
          for filename, cases, threads in (
              ("four-thread.csv", four, 4),
              ("one-thread.csv", {"cc-2p5-1t"}, 1),
          ):
              with (root / filename).open(newline="", encoding="utf-8") as stream:
                  rows = list(csv.DictReader(stream))
              assert len(rows) == len(cases) * 3 * 4, filename
              assert {row["case"] for row in rows} == cases, filename
              assert {int(row["threads"]) for row in rows} == {threads}, filename
              print(f"{filename}: {len(rows)} measurements, {threads} thread(s)")
          PY
      - name: Plot four precision/backend bars across all five cases
        run: |
          uv run --locked --no-sync python benchmarks/plot.py \
            --csv "$RUNNER_TEMP/sht-bench/four-thread.csv" \
                  "$RUNNER_TEMP/sht-bench/one-thread.csv" \
            --output-dir "$RUNNER_TEMP/sht-bench/figures"
          test "$(find "$RUNNER_TEMP/sht-bench/figures" -name 'timings-*.svg' | wc -l)" -eq 5
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: five-grid-sht-bench-${{ github.sha }}
          path: ${{ runner.temp }}/sht-bench/
          if-no-files-found: warn
