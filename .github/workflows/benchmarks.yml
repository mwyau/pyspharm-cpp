name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: SHT benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          environment-file: .github/conda/pyspharm.yml
          activate-environment: pyspharm-reference
          auto-activate: false
          channel-priority: strict
      - name: Install C++ extension
        run: conda run -n pyspharm-reference python -m pip install --no-build-isolation --no-deps -e .
      - name: Run three SIMD profiles
        run: bash benchmarks/run_profiles.sh "$RUNNER_TEMP/sht-bench"
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: five-grid-sht-bench-${{ github.sha }}
          path: ${{ runner.temp }}/sht-bench/
          if-no-files-found: warn
