# Maintainer policy: pin Actions to exact published patch-version tags, e.g.
# actions/checkout@v7.0.1. Zizmor's ref-pin policy checks for an explicit ref;
# it does not independently enforce patch-level versions. Do not use moving
# major-version tags or branch refs. Commit-hash pinning is not required.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
