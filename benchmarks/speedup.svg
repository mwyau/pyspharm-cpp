<svg xmlns="http://www.w3.org/2000/svg" width="860" height="345" viewBox="0 0 860 345" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Observed PySpharm-to-pyspharm-cpp speedup</title>
<desc id="chart-desc">Three operations at 512 by 256, float32, one thread. Larger ratios mean lower pyspharm-cpp latency.</desc>
<rect x="0" y="0" width="860" height="345" fill="white"/>
<text x="26" y="41" font-family="sans-serif" font-size="20" font-weight="600" fill="#1e293b">Observed SHT speedup</text>
<text x="26" y="66" font-family="sans-serif" font-size="13" fill="#475569">PySpharm 1.0.9 latency / pyspharm-cpp latency · 512×256 Gaussian · float32 · one thread</text>
<line x1="242.0" y1="92" x2="242.0" y2="289" stroke="#dce2e8" stroke-width="1"/>
<text x="242.0" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">0×</text>
<line x1="388.7" y1="92" x2="388.7" y2="289" stroke="#dce2e8" stroke-width="1"/>
<text x="388.7" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">10×</text>
<line x1="535.3" y1="92" x2="535.3" y2="289" stroke="#dce2e8" stroke-width="1"/>
<text x="535.3" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">20×</text>
<line x1="682.0" y1="92" x2="682.0" y2="289" stroke="#dce2e8" stroke-width="1"/>
<text x="682.0" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">30×</text>
<text x="26" y="133" font-family="sans-serif" font-size="14" fill="#1e293b">Scalar analysis</text>
<rect x="242" y="110" width="376.0" height="33" fill="#35698c" rx="2"/>
<text x="627.0" y="133" font-family="sans-serif" font-weight="600" font-size="14" fill="#1e293b">25.6×</text>
<text x="26" y="203" font-family="sans-serif" font-size="14" fill="#1e293b">Wind analysis</text>
<rect x="242" y="180" width="103.0" height="33" fill="#35698c" rx="2"/>
<text x="354.0" y="203" font-family="sans-serif" font-weight="600" font-size="14" fill="#1e293b">7.0×</text>
<text x="26" y="273" font-family="sans-serif" font-size="14" fill="#1e293b">8-field analysis</text>
<rect x="242" y="250" width="350.1" height="33" fill="#35698c" rx="2"/>
<text x="601.1" y="273" font-family="sans-serif" font-weight="600" font-size="14" fill="#1e293b">23.9×</text>
<text x="26" y="335" font-family="sans-serif" font-size="11" fill="#64748b">Historical single-host medians; workload-dependent. Re-run benchmark.py for your system.</text>
</svg>
